name: TypeNova - Build and Verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Regression tests for pure modules
        run: npm test
      - name: Section graph performance benchmark
        run: npm run benchmark:graph
      - name: TypeScript check and Vite build
        run: npm run build
      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: typenova-frontend-dist
          path: dist/
          if-no-files-found: error

  tauri-windows:
    name: Windows desktop build
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build Tauri application
        run: npm run tauri:build
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: typenova-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
