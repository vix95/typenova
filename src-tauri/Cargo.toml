[package]
name = "typenova"
version = "0.5.113"
description = "A fast, private Markdown workspace for writing, thinking and building knowledge."
authors = ["itvix.pl"]
edition = "2021"
rust-version = "1.90"
[lib]
name = "typenova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-persisted-scope = "=2.3.4"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
